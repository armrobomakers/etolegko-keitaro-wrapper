<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Keitaro Wrapper</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">K</div>
    <p class="eyebrow">KEITARO WRAPPER</p>
    <h1>Вход в приложение</h1>
    <p class="muted">Введите учётные данные приложения.</p>
    {% if not auth_configured %}
    <div class="login-error" role="alert">Аутентификация ещё не настроена. Задайте APP_USERNAME, APP_PASSWORD (не короче 16 символов) и APP_SESSION_SECRET (не короче 32 символов) в переменных окружения.</div>
    {% endif %}
    <form id="login-form" class="login-form">
      <label>Логин<input name="username" autocomplete="username" required maxlength="120" autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button class="primary" type="submit" {% if not auth_configured %}disabled{% endif %}>Войти</button>
      <p id="login-error" class="login-error hidden" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
